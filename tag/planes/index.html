<style>
/* Same system as arnavraja.in: paper and ink, one accent per part of the domain. */
:root {
  --paper: #F2F3EF; --paper-2: #E8EAE4; --ink: #16211F; --muted: #56625D; --rule: #D1D6CF;
  --accent: #3F6B52; --mark: #F2B632;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #111513; --paper-2: #181D1A; --ink: #E7EBE7; --muted: #9AA59F; --rule: #2B332F; --accent: #9CCBAE; --mark: #E0A626; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #111513; --paper-2: #181D1A; --ink: #E7EBE7; --muted: #9AA59F; --rule: #2B332F; --accent: #9CCBAE; --mark: #E0A626; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: 64rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { padding-left: clamp(0px, 3vw, 2rem); padding-right: clamp(0px, 3vw, 2rem); }
header.top { padding-block: 1.5rem; }
.top .inner { display: flex; flex-wrap: wrap; gap: 0.75rem 2rem; align-items: baseline; justify-content: space-between; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 1.05rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.wordmark b { color: var(--accent); font-weight: 800; }
.wordmark span { color: var(--muted); font-weight: 400; }
nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; }
nav a { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); text-decoration: none; }

.stage { position: relative; margin-top: 0.5rem; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.stage canvas { display: block; width: 100%; height: clamp(14rem, 34vw, 22rem); touch-action: pan-y; }

.hero { padding-block: 2rem 1rem; }

h1 em { font-style: normal; color: var(--accent); }
.lede { max-width: 38rem; font-size: clamp(1.1rem, 2vw, 1.3rem); margin: 1.4rem 0 0; text-wrap: pretty; }

.balance { display: flex; height: 4px; margin: 2.5rem 0 0; }
.balance i { background: var(--ink); }
.balance i + i { background: var(--mark); }
section { padding-block: clamp(2rem, 5vw, 3.5rem); border-top: 1px solid var(--rule); }
.balance + section { border-top: 0; }
.sec { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 1rem 2.5rem; align-items: start; }
.sec > .label { padding-top: 0.55rem; }
.sec > * { min-width: 0; }
h2 { font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 2.1rem); letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 0.8rem; text-wrap: balance; }
.k { display: flex; align-items: center; gap: 0.5rem; }

.in .k::before { background: var(--mark); }

.shelf .m { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.empty { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); border: 1px dashed var(--rule); padding: 1rem 1.1rem; max-width: 40rem; margin: 1.25rem 0 0; }

.ideas { list-style: none; margin: 1.25rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.ideas a { display: block; background: var(--paper); padding: 0.9rem 1rem; text-decoration: none; color: var(--ink); height: 100%; }
.ideas a:hover { background: var(--paper-2); }
.ideas li:last-child { grid-column: 1 / -1; }
.ideas b { display: block; font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.ideas span { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; margin-top: 1.25rem; }
.stages > div { border-top: 1px solid var(--ink); padding-top: 0.9rem; min-width: 0; }
.stages h3 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin: 0 0 0.3rem; }
.stages h3 a { color: var(--ink); text-decoration: none; }
.stages h3 a:hover { color: var(--accent); }
.stages p { font-size: 0.95rem; color: var(--muted); }
.works { list-style: none; margin: 1.25rem 0 0; padding: 0; display: grid; gap: 1rem; max-width: 40rem; }
.work { display: grid; gap: 0.25rem; padding: 1.1rem 1.2rem; border: 1px solid var(--rule); border-left: 3px solid var(--accent); text-decoration: none; color: var(--ink); background: var(--paper); }
.work:hover { background: var(--paper-2); }
.w-meta { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.w-title { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.015em; }
.w-text { font-size: 1rem; color: var(--muted); }
.w-go { font-family: var(--mono); font-size: 0.82rem; color: var(--accent); margin-top: 0.35rem; }
.w-go::after { content: " \2192"; }
.sub-h { font-family: var(--display); font-weight: 600; font-size: 1.25rem; margin: 2.25rem 0 0; }

footer { border-top: 1px solid var(--rule); margin-top: 2rem; padding-block: 1.75rem 2.5rem; }
footer .inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }

footer a { color: var(--muted); }
footer a:hover { color: var(--ink); }
@media (max-width: 720px) {

  .sec > .label { padding-top: 0; }
  .stages { grid-template-columns: minmax(0, 1fr); }
  .shelf li { grid-template-columns: minmax(0, 1fr); }
}
</style>
